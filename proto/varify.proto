syntax = "proto3";

package message;

// Verification service shared by GateServer and VarifyServer.
service VarifyService {
  rpc GetVarifyCode(GetVarifyReq) returns (GetVarifyRsp) {}
}

message GetVarifyReq {
  string email = 1;
  // Empty retains registration behavior; reset_password is a distinct credential.
  string purpose = 2;
}

message GetVarifyRsp {
  int32 error = 1;
  string email = 2;
  string code = 3;
}
