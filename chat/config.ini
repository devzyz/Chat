[GateServer]
host=localhost
port=8080

[Log]
; 日志文件基础名称，最终文件名默认为 chat.log
Name=chat
; 日志目录，相对于客户端可执行文件所在目录
Directory=Logs
; 单个日志文件的最大容量，单位为 MB
MaxSizeMB=10
; 日志文件总数，包含当前文件和轮转文件
MaxTotalFiles=10
; 可选值：auto、trace、debug、info、warn、error、critical、off
; auto 表示 Debug 构建使用 debug，Release 构建使用 info
Level=auto
; 达到此等级时立即刷新日志文件
FlushLevel=warn
; 周期刷新日志的时间间隔，单位为秒
FlushIntervalSeconds=3
