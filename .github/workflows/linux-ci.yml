name: Linux real dependencies and compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, master, "phase-3c-integration-*"]

permissions:
  contents: read

jobs:
  posix-process-contracts:
    name: Linux POSIX process lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Acquire locked CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.28.3"
          ninjaVersion: "1.12.1"
          useCloudCache: false
          useLocalCache: false
      - name: Run real child lifecycle without service dependencies
        run: bash scripts/linux-ci.sh --phase 3C --configuration Release --selector 3C-01-posix
      - name: Upload process lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-posix-process-evidence
          path: out/phase3c/ownership/junit/*.xml
          if-no-files-found: error
          retention-days: 7

  linux-preflight:
    name: Linux configure compile link and startup preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      status: ${{ steps.preflight-status.outputs.status }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_DISABLE_METRICS: "1"
      CHAT_EVIDENCE_ROOT: ${{ github.workspace }}/out/phase3c/preflight
      CHAT_EXPECTED_GNU_VERSION: "13.3.0"
      CHAT_EXPECTED_CMAKE_VERSION: "3.28.3"
      CHAT_EXPECTED_QT_VERSION: "6.5.3"
      CHAT_EXPECTED_NODE_VERSION: "22.18.0"
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Acquire locked CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.28.3"
          ninjaVersion: "1.12.1"
          useCloudCache: false
          useLocalCache: false

      - name: Select locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json

      - name: Acquire locked Qt runtime
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.5.3"
          host: linux
          target: desktop
          arch: gcc_64
          cache: false

      - name: Check out repository-pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: fc3be1ebea7eaeb3071fe716ac65713af1f3a146
          path: .ci/vcpkg
          fetch-depth: 0

      - name: Bootstrap run-owned vcpkg
        run: bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install MySQL native RPC prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libtirpc-dev
          pkg-config --exists libtirpc
          test -f /usr/include/tirpc/rpc/rpc.h

      - name: Run fail-closed Linux preflight
        # Leave time for blocked evidence and artifact upload before the job cap.
        timeout-minutes: 57
        run: |
          node --test tests/server/schema-migration/migration.test.js
          mkdir -p "$CHAT_EVIDENCE_ROOT"
          set -o pipefail
          timeout --signal=TERM --kill-after=30s 55m \
            bash scripts/linux-ci.sh --phase 3C --configuration Release --selector 3C-00-T2 \
            2>&1 | tee "$CHAT_EVIDENCE_ROOT/preflight.log"

      - name: Verify shared production targets and ProcessHarness
        run: bash scripts/linux-ci.sh --phase 3C --configuration Release --selector 3C-01

      - name: Build same-source service RunContext launcher
        run: |
          timeout --signal=TERM --kill-after=5s 120s cmake --build out/build/linux-x64-release --target service_run redis_adapter_integration message_commit_integration gate_mysql_pool_tests FourProcessDriver --parallel 2
          timeout --signal=TERM --kill-after=5s 180s cmake --build out/build/linux-x64-release --target chat_e2e_client session_driver_tests --parallel 2
          CHAT_E2E_CLIENT="$PWD/out/build/linux-x64-release/bin/chat_e2e_client" node --test tests/services/twoServerTopology.test.js tests/services/clientControl.test.js tests/services/phase3dEvidence.test.js tests/services/connectionCount.test.js
          ctest --test-dir out/build/linux-x64-release -R '^session_driver\.' --output-on-failure --no-tests=error --output-junit "$CHAT_EVIDENCE_ROOT/linux_phase3d_client.xml"
          ctest --test-dir out/build/linux-x64-release -L 'phase3c-(redis|message-commit|gate-mysql)-local' --output-on-failure --no-tests=error
          CHAT_FOUR_DRIVER="$PWD/out/build/linux-x64-release/bin/FourProcessDriver" node --test tests/services/driver.test.js tests/services/fourProcess.test.js
          mkdir -p out/phase3c/service-launcher
          cp out/build/linux-x64-release/bin/service_run out/phase3c/service-launcher/
          cp out/build/linux-x64-release/bin/redis_adapter_integration out/phase3c/service-launcher/
          cp out/build/linux-x64-release/bin/libhiredis.so.1 out/phase3c/service-launcher/
          node tests/services/serviceRuntime.js out/phase3c/service-launcher
          env -u LD_LIBRARY_PATH -u LD_PRELOAD out/phase3c/service-launcher/redis_adapter_integration lifecycle
          node tests/services/messageRuntime.js pack out/build/linux-x64-release/bin/message_commit_integration out/phase3c/service-launcher/message .ci/vcpkg_installed
          git rev-parse HEAD > out/phase3c/service-launcher/source-sha.txt
          node tests/services/fourRuntime.js pack out/build/linux-x64-release/bin out/phase3c/service-launcher/four .ci/vcpkg_installed
          node tests/services/clientRuntime.js pack out/build/linux-x64-release/bin/chat_e2e_client out/phase3c/service-launcher/client "$(qmake -query QT_INSTALL_PREFIX)"
          (cd out/phase3c/service-launcher && sha256sum service_run redis_adapter_integration libhiredis.so.1 message/* four/*/* client/* > service_run.sha256)

      - name: Upload same-run service launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-service-launcher
          path: out/phase3c/service-launcher/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload build ownership evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-build-ownership-evidence
          path: out/phase3c/ownership/junit/*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Confirm preflight PASS contract
        id: preflight-status
        run: |
          jq -e '.status == "PASS"' out/phase3c/preflight/linux-preflight.json
          echo 'status=PASS' >> "$GITHUB_OUTPUT"

      - name: Upload Linux preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-linux-preflight
          path: out/phase3c/preflight/**
          if-no-files-found: error
          retention-days: 7

  disposable-services:
    name: Phase 3C disposable services
    needs: [linux-preflight, posix-process-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      redis:
        image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        ports: ["127.0.0.1::6379"]
      mysql:
        image: mysql:8.4.4@sha256:23818b7d7de427096ab1427b2e3d9d5e14a5b933f9a4431a482d6414bc879091
        env: &disposable-mysql-bootstrap
          # Bootstrap only in this disposable loopback-only job. The coordinator
          # installs random credentials over stdin before creating any run data.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_INITDB_SKIP_TZINFO: "yes"
        ports: ["127.0.0.1::3306"]
      mailpit:
        image: axllent/mailpit:v1.24.1@sha256:4873e5a441ed368f1e98a832f61257a033859f5e829542cd03fb772d2282ea4e
        env:
          MP_DATABASE: /tmp/phase3c-mailpit.db
        ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
    env:
      CHAT_SERVICE_LAUNCHER: ${{ github.workspace }}/out/phase3c/service-launcher/service_run
      CHAT_REDIS_TEST_BINARY: ${{ github.workspace }}/out/phase3c/service-launcher/redis_adapter_integration
      CHAT_FOUR_BUNDLE: ${{ github.workspace }}/out/phase3c/service-launcher/four
      CHAT_MESSAGE_TEST_BINARY: ${{ github.workspace }}/out/phase3c/service-launcher/message/message_commit_integration
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json
      - name: Acquire locked CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.28.3"
          ninjaVersion: "1.12.1"
          useCloudCache: false
          useLocalCache: false
      - name: Download launcher from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase3c-service-launcher
          path: out/phase3c/service-launcher
      - name: Verify launcher identity and locked service configuration
        run: |
          test "$(cat out/phase3c/service-launcher/source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd out/phase3c/service-launcher && sha256sum --check service_run.sha256)
          chmod u+x "$CHAT_SERVICE_LAUNCHER"
          chmod u+x "$CHAT_REDIS_TEST_BINARY"
          chmod u+x "$CHAT_MESSAGE_TEST_BINARY"
          node tests/services/serviceRuntime.js out/phase3c/service-launcher
          find out/phase3c/service-launcher/four -type f -name "*Server" -exec chmod u+x {} +
          chmod u+x out/phase3c/service-launcher/four/driver/FourProcessDriver
          node tests/services/fourRuntime.js verify out/phase3c/service-launcher/four
          node tests/services/messageRuntime.js verify out/phase3c/service-launcher/message
          env -u LD_LIBRARY_PATH -u LD_PRELOAD "$CHAT_REDIS_TEST_BINARY" lifecycle
          node --test tests/services/coordinator.test.js
      - name: Restore existing locked Node libraries
        timeout-minutes: 2
        working-directory: VarifyServer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove bounded disposable service lifecycle
        timeout-minutes: 13
        env:
          CHAT_SERVICE_SELECTOR: 3C-07
          CHAT_REDIS_CONTAINER: ${{ job.services.redis.id }}
          CHAT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CHAT_MAILPIT_CONTAINER: ${{ job.services.mailpit.id }}
          CHAT_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          CHAT_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          CHAT_SMTP_PORT: ${{ job.services.mailpit.ports[1025] }}
          CHAT_MAILPIT_PORT: ${{ job.services.mailpit.ports[8025] }}
        run: bash scripts/linux-ci.sh --phase 3C --configuration Release --selector 3C-07
      - name: Preserve fail-closed outer evidence
        if: always()
        env:
          CHAT_SERVICE_SELECTOR: 3C-07
          CHAT_REDIS_CONTAINER: ${{ job.services.redis.id }}
          CHAT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CHAT_MAILPIT_CONTAINER: ${{ job.services.mailpit.id }}
        run: node tests/services/finalizeEvidence.js out/phase3c/services
      - name: Upload disposable dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-services-evidence
          path: out/phase3c/services/*
          if-no-files-found: error
          retention-days: 7

  two-server-contract:
    name: Linux two-server foundation contract
    needs: [linux-preflight, posix-process-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      redis:
        image: redis:7.4.2@sha256:fbdbaea47b9ae4ecc2082ecdb4e1cea81e32176ffb1dcf643d422ad07427e5d9
        ports: ["127.0.0.1::6379"]
      mysql:
        image: mysql:8.4.4@sha256:23818b7d7de427096ab1427b2e3d9d5e14a5b933f9a4431a482d6414bc879091
        env: *disposable-mysql-bootstrap
        ports: ["127.0.0.1::3306"]
      mailpit:
        image: axllent/mailpit:v1.24.1@sha256:4873e5a441ed368f1e98a832f61257a033859f5e829542cd03fb772d2282ea4e
        env:
          MP_DATABASE: /tmp/phase3c-mailpit.db
        ports: ["127.0.0.1::1025", "127.0.0.1::8025"]
    env:
      CHAT_CANDIDATE_SHA: ${{ github.sha }}
      CHAT_E2E_CLIENT: ${{ github.workspace }}/out/phase3c/service-launcher/client/chat_e2e_client
      CHAT_SERVICE_LAUNCHER: ${{ github.workspace }}/out/phase3c/service-launcher/service_run
      CHAT_REDIS_TEST_BINARY: ${{ github.workspace }}/out/phase3c/service-launcher/redis_adapter_integration
      CHAT_FOUR_BUNDLE: ${{ github.workspace }}/out/phase3c/service-launcher/four
      CHAT_MESSAGE_TEST_BINARY: ${{ github.workspace }}/out/phase3c/service-launcher/message/message_commit_integration
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json
      - name: Acquire locked CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: "3.28.3"
          ninjaVersion: "1.12.1"
          useCloudCache: false
          useLocalCache: false
      - name: Download launcher from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase3c-service-launcher
          path: out/phase3c/service-launcher
      - name: Verify launcher identity and locked service configuration
        run: |
          test "$(cat out/phase3c/service-launcher/source-sha.txt)" = "$(git rev-parse HEAD)"
          (cd out/phase3c/service-launcher && sha256sum --check service_run.sha256)
          chmod u+x "$CHAT_SERVICE_LAUNCHER"
          chmod u+x "$CHAT_REDIS_TEST_BINARY"
          chmod u+x "$CHAT_MESSAGE_TEST_BINARY"
          node tests/services/serviceRuntime.js out/phase3c/service-launcher
          find out/phase3c/service-launcher/four -type f -name "*Server" -exec chmod u+x {} +
          chmod u+x out/phase3c/service-launcher/four/driver/FourProcessDriver
          node tests/services/fourRuntime.js verify out/phase3c/service-launcher/four
          node tests/services/messageRuntime.js verify out/phase3c/service-launcher/message
          env -u LD_LIBRARY_PATH -u LD_PRELOAD "$CHAT_REDIS_TEST_BINARY" lifecycle
          node tests/services/clientRuntime.js verify out/phase3c/service-launcher/client
          chmod u+x "$CHAT_E2E_CLIENT"
      - name: Restore existing locked Node libraries
        timeout-minutes: 2
        working-directory: VarifyServer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove five-service two-client foundation and friendship
        timeout-minutes: 13
        env:
          CHAT_SERVICE_SELECTOR: 3D-01
          CHAT_REDIS_CONTAINER: ${{ job.services.redis.id }}
          CHAT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CHAT_MAILPIT_CONTAINER: ${{ job.services.mailpit.id }}
          CHAT_REDIS_PORT: ${{ job.services.redis.ports[6379] }}
          CHAT_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          CHAT_SMTP_PORT: ${{ job.services.mailpit.ports[1025] }}
          CHAT_MAILPIT_PORT: ${{ job.services.mailpit.ports[8025] }}
        run: bash scripts/linux-ci.sh --phase 3D --configuration Release --selector 3D-01
      - name: Preserve fail-closed outer evidence
        if: always()
        env:
          CHAT_SERVICE_SELECTOR: 3D-01
          CHAT_REDIS_CONTAINER: ${{ job.services.redis.id }}
          CHAT_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          CHAT_MAILPIT_CONTAINER: ${{ job.services.mailpit.id }}
        run: node tests/services/finalizeEvidence.js out/phase3d/contracts
      - name: Upload disposable dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3d-contract-evidence
          path: out/phase3d/contracts/*
          if-no-files-found: error
          retention-days: 7

  downstream-contract:
    name: Phase 3C downstream hard gate
    needs: [linux-preflight, posix-process-contracts, disposable-services]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHAT_RELEASE_INVENTORY: ${{ github.workspace }}/out/phase3c/releases.json
      CHAT_JOB_RESULTS: '{"linux-preflight":"${{ needs.linux-preflight.result }}","posix-process-contracts":"${{ needs.posix-process-contracts.result }}","disposable-services":"${{ needs.disposable-services.result }}"}'
    steps:
      - name: Check out candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select locked Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18.0"
      - name: Test compatibility and evidence failure propagation
        run: |
          node --test tests/compatibility/bootstrap.test.js
          python3 tests/services/gate_test.py
      - name: Download this run's service evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase3c-services-evidence
          path: out/phase3c/services
      - name: Resolve published runtime baseline inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/phase3c
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$CHAT_RELEASE_INVENTORY"
          result=0
          bash scripts/linux-ci.sh --phase 3C --configuration Release --selector 3C-08 || result=$?
          # Exit 2 is an explicit unexecuted bootstrap matrix, not compatibility PASS.
          test "$result" -eq 2
      - name: Aggregate current-N reports and preserve compatibility blocker
        if: always()
        run: bash scripts/linux-ci.sh --phase 3C --configuration Release --junit-dir out/phase3c/gate
      - name: Upload phase gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase3c-gate-evidence
          path: |
            out/phase3c/gate/
            out/phase3c/compatibility/
          if-no-files-found: error
          retention-days: 7
