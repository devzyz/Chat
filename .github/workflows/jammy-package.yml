name: Ubuntu 22.04 server package
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      CC: /usr/bin/gcc-11
      CXX: /usr/bin/g++-11
      VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_MAX_CONCURRENCY: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Acquire locked CMake and Ninja
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/install-linux-tools.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
      - name: Read repository vcpkg baseline
        id: baseline
        run: echo "commit=$(jq -er '."builtin-baseline"' vcpkg.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.baseline.outputs.commit }}
          path: .ci/vcpkg
      - name: Prepare Jammy build dependencies
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.35'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtirpc-dev
          bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/jammy-vcpkg"
          echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/jammy-vcpkg,readwrite" >> "$GITHUB_ENV"
      - name: Restore Jammy GCC 11 binary archives
        id: cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/jammy-vcpkg
          key: jammy-x64-gcc11-v1-${{ hashFiles('vcpkg.json', 'triplets/x64-linux-chat-release.cmake') }}
      - name: Build the release-only dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install --clean-after-build --triplet x64-linux-chat-release \
            --host-triplet x64-linux-chat-release --overlay-triplets="$PWD/triplets" \
            --x-install-root="$PWD/.ci/vcpkg_installed"
      - name: Save Jammy archives
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/jammy-vcpkg
          key: jammy-x64-gcc11-v1-${{ hashFiles('vcpkg.json', 'triplets/x64-linux-chat-release.cmake') }}
      - name: Build and package all four services
        run: |
          cmake --preset linux-x64-release -B out/jammy -DCHAT_ENABLE_HOSTED_PREFLIGHT=OFF \
            -DCHAT_BUILD_CLIENT=OFF -DCHAT_BUILD_ACCEPTANCE_RESOURCES=ON -DBUILD_TESTING=OFF -DVCPKG_MANIFEST_INSTALL=OFF
          cmake --build out/jammy --target GateServer ChatServer ResourceServer --parallel 3
          npm ci --prefix VarifyServer --omit=dev --ignore-scripts
          bash scripts/deploy/package.sh out/jammy/bin "$RUNNER_TEMP/jammy-release"
      - name: Test deployment activation and rollback on Jammy
        run: |
          sudo apt-get install -y --no-install-recommends supervisor redis-server postgresql postgresql-client
          bash tests/deploy/jammy-smoke.sh "$RUNNER_TEMP/jammy-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jammy-server-release
          path: ${{ runner.temp }}/jammy-release/*
          if-no-files-found: error
          retention-days: 7
