name: Release
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Four-package release rehearsal' || format('Release {0}', github.ref_name) }}
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || (github.event.created && !github.event.deleted && !github.event.forced)
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: source
        name: Resolve the tested commit and stable version
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tag="v$(cat VERSION)"; fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: source
    uses: ./.github/workflows/windows-ci.yml
    with:
      build_packages: true
      refresh_tools: false

  linux-regression:
    needs: source
    uses: ./.github/workflows/linux-ci.yml

  linux-server:
    needs: source
    uses: ./.github/workflows/jammy-package.yml

  linux-client:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.5.3'
          host: linux
          target: desktop
          arch: gcc_64
          cache: true
      - name: Build the production Qt desktop client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
          cmake -S chat -B out/gui -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build out/gui --target chat --parallel 3
          bash scripts/release/linux_client.sh out/gui "$(qmake -query QT_INSTALL_PREFIX)" "$RUNNER_TEMP/desktop"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-desktop-package
          path: ${{ runner.temp }}/desktop/Chat-client-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  linux-client-smoke:
    needs: [source, linux-client]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-desktop-package
          path: desktop
      - name: Open the release desktop window on a fresh runner
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool libopengl0 libegl1 libgl1 libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0
          xvfb-run -a bash scripts/release/linux_client_smoke.sh desktop/Chat-client-linux-x64.tar.gz "$SOURCE_SHA"

  windows-smoke:
    needs: [source, windows]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: windows-*-release
          path: inputs
      - name: Assemble separate archives and smoke their exact bytes
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: |
          python scripts/release/windows_roles.py --artifacts inputs --output packages --sha $env:SOURCE_SHA --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/smoke.py --directory packages --sha $env:SOURCE_SHA --report smoke/windows-package-smoke.xml
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-package-smoke
          path: smoke/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-pair
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 7

  candidate:
    needs: [source, windows-smoke, linux-client-smoke, linux-server, linux-regression]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-release-pair
          path: four
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-desktop-package
          path: four
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jammy-server-release
          path: jammy
      - name: Exercise four formal assets, two rolling assets and tag pulls offline
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          (cd jammy && sha256sum -c SHA256SUMS)
          mv jammy/chat-jammy-x64.tar.gz four/Chat-server-linux-x64.tar.gz
          python3 tests/release/contracts/rehearse.py four "$RELEASE_TAG" "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-release-four
          path: four/*
          retention-days: 7
          if-no-files-found: error

  formal:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source, candidate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-release-four
          path: four
      - name: Publish the verified formal release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/publish.py formal --directory four --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"

  rolling:
    needs: [source, formal]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: chat-rolling-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Sync the two original assets from the highest published stable version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/publish.py rolling --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
