name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI {0} {1}', inputs.mode, inputs.performance_request_id) || github.event.head_commit.message || github.event.pull_request.title || 'CI' }}

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Monday 03:17 Asia/Shanghai (Sunday UTC).
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      autodl:
        description: Ubuntu 22.04 delivery (deploy is available on develop)
        type: choice
        options: [skip, package, deploy]
        default: skip
      mode:
        description: Validation scope (optional acceptance or maintenance flags require full)
        type: choice
        options: [quick, full, performance]
        default: full
      performance_profile:
        description: Manual performance load profile
        type: choice
        options: [smoke, baseline, stress, large-history, comprehensive]
        default: baseline
      performance_request_id:
        description: Unique performance request identity (optional)
        type: string
        default: ''
      performance_source_sha:
        description: Expected measured commit (optional; checked before building)
        type: string
        default: ''
      refresh_tools:
        description: Cold-build latest stable Windows tools and approve after Windows checks (default branch only)
        type: boolean
        default: false
      real_acceptance:
        description: Run opt-in first-release acceptance with all production services and four accounts
        type: boolean
        default: false
      cold_linux:
        description: Verify Linux dependency restoration without binary cache
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'develop-push') || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  jammy-package:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'performance' && (inputs.autodl == 'package' ||
      (inputs.autodl == 'deploy' && github.ref == 'refs/heads/develop'))) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AUTODL_AUTO_DEPLOY == 'true')
    uses: ./.github/workflows/jammy-package.yml

  autodl-deploy:
    needs: [plan, regression, full, jammy-package]
    if: >-
      !cancelled() && github.ref == 'refs/heads/develop' &&
      ((github.event_name == 'workflow_dispatch' && inputs.autodl == 'deploy') ||
      (github.event_name == 'push' && vars.AUTODL_AUTO_DEPLOY == 'true')) &&
      needs.jammy-package.result == 'success' && needs.regression.result == 'success' &&
      (needs.full.result == 'success' || (needs.plan.outputs.mode == 'quick' && needs.full.result == 'skipped'))
    runs-on: ubuntu-22.04
    environment: autodl
    timeout-minutes: 10
    concurrency:
      group: autodl-activation
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jammy-server-release
          path: bundle
      - name: Deliver the verified archive to the restricted receiver
        working-directory: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.AUTODL_DEPLOY_KEY }}
          HOST_KEY: ${{ vars.AUTODL_KNOWN_HOSTS }}
          HOST: ${{ vars.AUTODL_HOST }}
          PORT: ${{ vars.AUTODL_PORT }}
          USERNAME: ${{ vars.AUTODL_USER }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[[:alnum:]][[:alnum:].-]*$ && "$PORT" =~ ^[0-9]{1,5}$ && "$USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS
          keydir=$(mktemp -d)
          trap 'rm -rf -- "$keydir"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          printf '%s\n' "$HOST_KEY" > "$keydir/known_hosts"
          digest=$(sha256sum chat-jammy-x64.tar.gz | cut -d' ' -f1)
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -o UserKnownHostsFile="$keydir/known_hosts" -i "$keydir/key" -p "$PORT" \
            "$USERNAME@$HOST" "activate $GITHUB_SHA $digest" < chat-jammy-x64.tar.gz

  plan:
    name: Select CI mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      refresh_tools: ${{ steps.policy.outputs.refresh_tools }}
      cold_linux: ${{ steps.policy.outputs.cold_linux }}
      real_acceptance: ${{ steps.policy.outputs.real_acceptance }}
      performance_profile: ${{ steps.policy.outputs.performance_profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve validation scope without toolchain or artifact queries
        id: policy
        run: node scripts/ci/ciPolicy.js
      - name: Pin requested performance source
        if: steps.policy.outputs.mode == 'performance'
        env:
          EXPECTED_SHA: ${{ inputs.performance_source_sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"

  windows:
    needs: plan
    if: needs.plan.outputs.mode != 'performance'
    uses: ./.github/workflows/windows-ci.yml
    with:
      build_packages: ${{ needs.plan.outputs.mode == 'full' }}
      refresh_tools: ${{ needs.plan.outputs.refresh_tools == 'true' }}

  linux:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-ci.yml
    with:
      cold_build: ${{ needs.plan.outputs.cold_linux == 'true' }}
      real_acceptance: ${{ needs.plan.outputs.real_acceptance == 'true' }}

  regression:
    name: Regression checks
    if: ${{ always() && needs.plan.outputs.mode != 'performance' }}
    needs: [plan, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Windows build and regression job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT: ${{ needs.windows.result }}
        run: test "$PLAN_RESULT" = success && test "$RESULT" = success

  full:
    name: Full regression checks
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.mode == 'full') }}
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platforms and all integration tests
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$PLAN_RESULT" = success && test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success

  real-acceptance:
    name: Real environment acceptance
    # Keep an explicitly requested gate visible even when policy selection fails.
    # Keep an explicitly requested gate visible even when policy selection fails.
    if: ${{ always() && (needs.plan.outputs.real_acceptance == 'true' || (github.event_name == 'workflow_dispatch' && inputs.real_acceptance == true)) }}
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require requested real-service acceptance and both platforms
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$PLAN_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success
          printf 'Real environment acceptance passed for `%s`. See phase3d-contract-evidence and real-acceptance-widgets.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: full
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  performance:
    name: Manual performance (${{ needs.plan.outputs.performance_profile }})
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.mode == 'performance'
    uses: ./.github/workflows/performance.yml
    with:
      profile: ${{ needs.plan.outputs.performance_profile }}
      request_id: ${{ inputs.performance_request_id }}

  failure-index:
    name: Failure diagnostics
    needs: [plan, windows, linux, performance]
    if: ${{ failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Link failed jobs and steps from this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          echo '### Failed CI steps' >> "$GITHUB_STEP_SUMMARY"
          gh api --paginate "$endpoint?per_page=100" --jq '
            .jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") |
            . as $job | [.steps[]? | select(.conclusion == "failure" or .conclusion == "timed_out")] as $failed |
            if ($failed | length) == 0 then
              "- [\($job.name) — job log](\($job.html_url))"
            else $failed[] | "- [\($job.name) — \(.name)](\($job.html_url)#step:\(.number):1)"
            end' >> "$GITHUB_STEP_SUMMARY"
