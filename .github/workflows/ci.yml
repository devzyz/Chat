name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Monday 03:17 Asia/Shanghai (Sunday UTC).
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      refresh_tools:
        description: Cold-build latest stable Windows tools and approve after Windows checks (default branch only)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toolchain:
    name: Select validated toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      lock: ${{ steps.select.outputs.lock }}
      refresh: ${{ steps.select.outputs.refresh }}
      run_id: ${{ steps.select.outputs.run_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve approved weekly toolchain or committed bootstrap
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_TOOLS: ${{ inputs.refresh_tools == true }}
        run: node scripts/ci/toolchain.js select "$RUNNER_TEMP/toolchain"

  windows:
    needs: toolchain
    uses: ./.github/workflows/windows-ci.yml
    with:
      toolchain_lock: ${{ needs.toolchain.outputs.lock }}
      toolchain_run: ${{ needs.toolchain.outputs.run_id }}
      refresh_tools: ${{ needs.toolchain.outputs.refresh == 'true' }}

  linux:
    needs: toolchain
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.base_ref == 'master'
    uses: ./.github/workflows/linux-ci.yml
    with:
      cold_build: ${{ needs.toolchain.outputs.refresh == 'true' }}

  regression:
    name: Regression checks
    if: ${{ always() }}
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Windows build and regression job
        env:
          RESULT: ${{ needs.windows.result }}
        run: test "$RESULT" = success

  full:
    name: Full regression checks
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.base_ref == 'master') }}
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platforms and all integration tests
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: full
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  promote-toolchain:
    name: Promote Windows-validated weekly toolchain
    needs: [toolchain, windows]
    if: ${{ always() && needs.toolchain.outputs.refresh == 'true' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-toolchain-candidate
          path: toolchain
      - name: Publish version record after Windows regression and cache warming
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-toolchain-approved
          path: toolchain/windows-toolchain.json
          if-no-files-found: error
          retention-days: 90
