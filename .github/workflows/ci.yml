name: CI
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI {0} {1}', inputs.mode, inputs.performance_request_id) || github.event.head_commit.message || github.event.pull_request.title || 'CI' }}

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Monday 03:17 Asia/Shanghai (Sunday UTC).
    - cron: '17 19 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope (optional acceptance or maintenance flags require full)
        type: choice
        options: [quick, full, performance]
        default: full
      performance_profile:
        description: Manual performance load profile
        type: choice
        options: [smoke, baseline, stress]
        default: baseline
      performance_request_id:
        description: Unique performance request identity (optional)
        type: string
        default: ''
      performance_source_sha:
        description: Expected measured commit (optional; checked before building)
        type: string
        default: ''
      refresh_tools:
        description: Cold-build latest stable Windows tools and approve after Windows checks (default branch only)
        type: boolean
        default: false
      real_acceptance:
        description: Run opt-in first-release acceptance with all production services and four accounts
        type: boolean
        default: false
      cold_linux:
        description: Verify Linux dependency restoration without binary cache
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'develop-push') || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  plan:
    name: Select CI mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      refresh_tools: ${{ steps.policy.outputs.refresh_tools }}
      cold_linux: ${{ steps.policy.outputs.cold_linux }}
      real_acceptance: ${{ steps.policy.outputs.real_acceptance }}
      performance_profile: ${{ steps.policy.outputs.performance_profile }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve validation scope without toolchain or artifact queries
        id: policy
        run: node scripts/ci/ciPolicy.js
      - name: Pin requested performance source
        if: steps.policy.outputs.mode == 'performance'
        env:
          EXPECTED_SHA: ${{ inputs.performance_source_sha }}
        run: test -z "$EXPECTED_SHA" || test "$EXPECTED_SHA" = "$GITHUB_SHA"

  windows:
    needs: plan
    if: needs.plan.outputs.mode != 'performance'
    uses: ./.github/workflows/windows-ci.yml
    with:
      build_packages: ${{ needs.plan.outputs.mode == 'full' }}
      refresh_tools: ${{ needs.plan.outputs.refresh_tools == 'true' }}

  linux:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/linux-ci.yml
    with:
      cold_build: ${{ needs.plan.outputs.cold_linux == 'true' }}
      real_acceptance: ${{ needs.plan.outputs.real_acceptance == 'true' }}

  regression:
    name: Regression checks
    if: ${{ always() && needs.plan.outputs.mode != 'performance' }}
    needs: [plan, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Windows build and regression job
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RESULT: ${{ needs.windows.result }}
        run: test "$PLAN_RESULT" = success && test "$RESULT" = success

  full:
    name: Full regression checks
    if: ${{ always() && (needs.plan.result != 'success' || needs.plan.outputs.mode == 'full') }}
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both platforms and all integration tests
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: test "$PLAN_RESULT" = success && test "$WINDOWS_RESULT" = success && test "$LINUX_RESULT" = success

  real-acceptance:
    name: Real environment acceptance
    # Keep an explicitly requested gate visible even when policy selection fails.
    # Keep an explicitly requested gate visible even when policy selection fails.
    if: ${{ always() && (needs.plan.outputs.real_acceptance == 'true' || (github.event_name == 'workflow_dispatch' && inputs.real_acceptance == true)) }}
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require requested real-service acceptance and both platforms
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$PLAN_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success
          printf 'Real environment acceptance passed for `%s`. See phase3d-contract-evidence and real-acceptance-widgets.\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: full
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  performance:
    name: Manual performance baseline
    needs: plan
    if: needs.plan.outputs.mode == 'performance'
    uses: ./.github/workflows/performance.yml
    with:
      profile: ${{ needs.plan.outputs.performance_profile }}
      request_id: ${{ inputs.performance_request_id }}
