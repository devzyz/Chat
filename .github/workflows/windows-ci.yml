name: Windows CI

on:
  workflow_call:
    inputs:
      toolchain_lock:
        type: string
        required: true
      toolchain_run:
        type: string
        default: ''
      refresh_tools:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  BUILD_PACKAGES: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.base_ref == 'master' }}

jobs:
  static-check:
    name: Static configuration checks
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned convention parsers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --target build/conventions/python -r scripts/conventions/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Convention parser installation failed.' }

      - name: Test incremental convention contracts
        shell: pwsh
        run: ./scripts/windows-local.ps1 -Task RunConventionTests

      - name: Check introduced Git and source conventions
        shell: pwsh
        run: ./scripts/windows-local.ps1 -Task CheckConventions

      - name: Validate GitHub Actions workflows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/test-workflows.ps1 -ToolRoot (Join-Path $env:RUNNER_TEMP 'chat-actionlint')

      - name: Validate build configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $solutionText = Get-Content -LiteralPath 'Chat.sln' -Raw
          $chatProject = '"ChatServer", "ChatServer\ChatServer\ChatServer.vcxproj"'
          $chatProjectCount = [regex]::Matches(
              $solutionText,
              [regex]::Escape($chatProject)
          ).Count
          if ($chatProjectCount -ne 1) {
              throw 'Chat.sln must contain exactly one canonical ChatServer project.'
          }
          if ($solutionText -match 'ChatServer1|ChatServer2') {
              throw 'Chat.sln still references a legacy ChatServer1/ChatServer2 project.'
          }

          $projectFiles = @(
              'GateServer/GateServer/GateServer.vcxproj'
              'GateServer/GateServer/GateGrpcClients.vcxproj'
              'StatusServer/StatusServer/StatusServer.vcxproj'
              'ChatServer/ChatServer/ChatServer.vcxproj'
              'ChatServer/ChatServer/ChatGrpcClients.vcxproj'
              'ResourceServer/ResourceServer/ResourceServer/ResourceServer.vcxproj'
              'tests/server/resource/ResourceTests.vcxproj'
              'tests/server/ServerUnitTests.vcxproj'
              'tests/server/ServerComponentTests.vcxproj'
              'tests/server/ServerIntegrationTests.vcxproj'
              'tests/server/ChatGrpcClientTests.vcxproj'
              'tests/server/lifecycle/GateAsioPoolTests.vcxproj'
              'tests/server/lifecycle/StatusAsioPoolTests.vcxproj'
          )
          foreach ($projectFile in $projectFiles) {
              try {
                  [void][xml](Get-Content -LiteralPath $projectFile -Raw)
              } catch {
                  throw "Invalid MSBuild XML in ${projectFile}: $($_.Exception.Message)"
              }
          }

          $manifest = Get-Content -LiteralPath 'vcpkg.json' -Raw | ConvertFrom-Json
          if ($manifest.'builtin-baseline' -ne 'fc3be1ebea7eaeb3071fe716ac65713af1f3a146') {
              throw 'vcpkg.json does not use the expected pinned registry baseline.'
          }
          $dependencyNames = @($manifest.dependencies | ForEach-Object {
              if ($_ -is [string]) { $_ } else { $_.name }
          })
          $requiredDependencies = @(
              'boost-asio', 'boost-beast', 'boost-filesystem', 'boost-property-tree',
              'boost-uuid', 'grpc', 'gtest', 'hiredis', 'jsoncpp', 'mysql-connector-cpp',
              'protobuf', 'spdlog'
          )
          foreach ($dependency in $requiredDependencies) {
              if ($dependency -notin $dependencyNames) {
                  throw "vcpkg.json is missing required dependency: $dependency"
              }
          }

          $tripletText = Get-Content -LiteralPath 'triplets/x64-windows-chat-release.cmake' -Raw
          foreach ($setting in @(
              'set(VCPKG_TARGET_ARCHITECTURE x64)',
              'set(VCPKG_CRT_LINKAGE dynamic)',
              'set(VCPKG_LIBRARY_LINKAGE dynamic)',
              'set(VCPKG_BUILD_TYPE release)'
          )) {
              if (-not $tripletText.Contains($setting)) {
                  throw "Release-only triplet is missing: $setting"
              }
          }

          $activeBuildInputs = @(git ls-files -- '*.sln' '*.vcxproj' '*.props' '*.targets' '*.ps1' 'vcpkg.json' 'triplets/*.cmake')
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to enumerate tracked build configuration files.'
          }
          $legacyMatches = @(git grep -n -E 'ChatServer1[\\/]|ChatServer2[\\/]|x64-windows-static' -- $activeBuildInputs)
          if ($LASTEXITCODE -notin @(0, 1)) {
              throw 'Unable to scan active build configuration files.'
          }
          if ($legacyMatches.Count -gt 0) {
              $legacyMatches | ForEach-Object { Write-Error $_.Line }
              throw 'Active build configuration still references a legacy ChatServer path or static triplet.'
          }
          $global:LASTEXITCODE = 0

      - name: Verify all test sources are registered
        shell: pwsh
        run: .\scripts\windows-local.ps1 -Task CheckTestStructure

      - name: Verify GitHub asset download handling
        shell: powershell
        run: .\scripts\ci\test-vcpkg-github-asset.ps1

      - name: Verify binary cache refresh behavior
        shell: pwsh
        run: node --test tests/build/vcpkgBinaryCache.test.js tests/build/toolchain.test.js

      - name: Verify native toolchain snapshot recovery
        shell: powershell
        run: ./scripts/ci/test-native-toolchain.ps1

      - name: Verify CI triggers and execution budgets
        shell: pwsh
        run: node --test tests/build/ciBudget.test.js

      - name: Test release packaging
        shell: pwsh
        run: python tests/release/contracts/run_contracts.py

      - name: Verify server-only CMake configuration
        shell: pwsh
        run: cmake "-DCHAT_TEST_NINJA=$((Get-Command ninja).Source)" -P tests/build/server_only_configuration.cmake

      - name: Reject an already published master version
        if: github.base_ref == 'master' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/publish.py --check-version

      - name: Retain packaging regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-packaging-test-results
          path: build/test-results/release_candidate_contracts.xml
          if-no-files-found: error
          retention-days: 7

      - name: Run ChatServer instance script test modules
        shell: pwsh
        run: .\scripts\windows-local.ps1 -Task RunScriptTests -SkipTestStructureCheck

      - name: Upload layered script test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-script-test-results
          path: build/test-results/script_*.xml
          if-no-files-found: error
          retention-days: 7

  servers-release:
    name: Server Release build
    needs: static-check
    runs-on: windows-2022
    # Observed cold restore takes 174 minutes; retain time for tests and packaging.
    timeout-minutes: 240
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.ci\vcpkg
      VCPKG_BINARY_SOURCES: clear
      VCPKG_DISABLE_METRICS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22 for cross-language tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json

      - name: Free ephemeral runner disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Show-SystemDriveSpace([string]$Label) {
              $drive = Get-PSDrive -Name C
              Write-Host ("{0}: C: free {1:N2} GB of {2:N2} GB" -f $Label, ($drive.Free / 1GB), (($drive.Free + $drive.Used) / 1GB))
          }

          Show-SystemDriveSpace 'Before cleanup'
          $androidPath = 'C:\Android'
          if (Test-Path -LiteralPath $androidPath) {
              $resolvedAndroidPath = (Resolve-Path -LiteralPath $androidPath).Path
              if ($resolvedAndroidPath -ne $androidPath) {
                  throw "Refusing to remove unexpected path: $resolvedAndroidPath"
              }
              Remove-Item -LiteralPath $resolvedAndroidPath -Recurse -Force
              Write-Host "Removed ephemeral runner directory: $resolvedAndroidPath"
          } else {
              Write-Host 'Ephemeral runner directory C:\Android is not present.'
          }
          Show-SystemDriveSpace 'After cleanup'

      - name: Check out pinned vcpkg
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: fc3be1ebea7eaeb3071fe716ac65713af1f3a146
          path: .ci/vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg bootstrap failed with exit code $LASTEXITCODE."
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          if ($LASTEXITCODE -ne 0) {
              throw "vcpkg version check failed with exit code $LASTEXITCODE."
          }

      - name: Select and verify locked Windows toolchain before dependency restoration
        shell: pwsh
        env:
          CHAT_TOOLCHAIN_LOCK: ${{ inputs.toolchain_lock }}
          CHAT_REFRESH_TOOLS: ${{ inputs.refresh_tools }}
          CHAT_TOOLCHAIN_RUN: ${{ inputs.toolchain_run }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/ci/install-windows-toolchain.ps1 -VcpkgRoot $env:VCPKG_ROOT -Refresh:($env:CHAT_REFRESH_TOOLS -eq 'true')

      - name: Retain native toolchain snapshot
        if: inputs.refresh_tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-toolchain
          path: .ci/windows-native-toolchain.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Release uploaded native archive disk space
        if: inputs.refresh_tools
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.ci/windows-native-toolchain.tar') -Force

      - name: Retain candidate toolchain for Windows validation
        if: inputs.refresh_tools
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-toolchain-candidate
          path: .ci/windows-toolchain.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Prepare layered binary cache keys
        id: binary-cache-key
        shell: pwsh
        run: node scripts/ci/vcpkgBinaryCache.js prepare "$env:RUNNER_TEMP/vcpkg-binary-cache" x64-windows-chat-release

      - name: Restore vcpkg binary archives
        id: vcpkg-binary-cache
        if: ${{ !inputs.refresh_tools }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ steps.binary-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.binary-cache-key.outputs.prefix }}
            ${{ steps.binary-cache-key.outputs.fallback }}
            ${{ steps.binary-cache-key.outputs.legacy }}

      - name: Record restored binary archives
        id: binary-cache-before
        shell: pwsh
        run: node scripts/ci/vcpkgBinaryCache.js snapshot "$env:RUNNER_TEMP/vcpkg-binary-cache"

      - name: Restore server dependencies with binary archives
        id: dependency-restore
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $binaryCache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          [void](New-Item -ItemType Directory -Path $binaryCache -Force)
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
          # Use GitHub's archive data endpoint directly; vcpkg retains origin fallback.
          $assetProvider = Join-Path $env:GITHUB_WORKSPACE 'scripts\ci\vcpkg-github-asset.ps1'
          $env:X_VCPKG_ASSET_SOURCES = 'clear;x-script,powershell.exe -NoProfile -ExecutionPolicy Bypass -File "' + $assetProvider + '" "{url}" "{sha512}" "{dst}"'

          & .\scripts\windows-local.ps1 `
              -Task RestoreServers `
              -Configuration Release `
              -VcpkgRoot $env:VCPKG_ROOT `
              -VcpkgInstalledRoot (Join-Path $env:GITHUB_WORKSPACE '.ci\vcpkg_installed') `
              -VcpkgBuildtreesRoot (Join-Path $env:RUNNER_TEMP 'vcpkg-buildtrees') `
              -VcpkgPackagesRoot (Join-Path $env:RUNNER_TEMP 'vcpkg-packages') `
              -ServerIntermediateRoot (Join-Path $env:RUNNER_TEMP 'server-msbuild') `
              -ServerTriplet x64-windows-chat-release `
              -ServerHostTriplet x64-windows-chat-release |
              Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'vcpkg-restore.log')
          if ($LASTEXITCODE -ne 0) { throw "Dependency restore failed: $LASTEXITCODE" }

      - name: Report actual binary package reuse
        id: binary-cache-after
        if: always() && steps.binary-cache-before.outcome == 'success'
        env:
          CACHE_RESTORED_KEY: ${{ steps.vcpkg-binary-cache.outputs.cache-matched-key }}
          CACHE_PRIMARY_PREFIX: ${{ steps.binary-cache-key.outputs.prefix }}
        shell: pwsh
        run: node scripts/ci/vcpkgBinaryCache.js report "$env:RUNNER_TEMP/vcpkg-binary-cache" "$env:RUNNER_TEMP/vcpkg-restore.log"

      - name: Save new binary packages under an immutable key
        if: success() && steps.binary-cache-after.outputs.changed == 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: ${{ steps.binary-cache-key.outputs.key }}

      - name: Retain dependency ABI and compiler diagnostics
        if: always() && steps.dependency-restore.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-vcpkg-diagnostics
          include-hidden-files: true
          path: |
            .ci/windows-toolchain.json
            ${{ runner.temp }}/vcpkg-restore.log
            .ci/vcpkg_installed/x64-windows-chat-release/share/*/vcpkg_abi_info.txt
            ${{ runner.temp }}/vcpkg-buildtrees/detect_compiler/**/*.log
            ${{ runner.temp }}/vcpkg-buildtrees/detect_compiler/**/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Remove vcpkg binary archives before MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $expectedCache = Join-Path $runnerTemp 'vcpkg-binary-cache'

          if (Test-Path -LiteralPath $expectedCache) {
              $cacheItem = Get-Item -LiteralPath $expectedCache -Force
              if ($cacheItem.FullName -ne $expectedCache -or
                  ($cacheItem.Attributes -band [System.IO.FileAttributes]::ReparsePoint)) {
                  throw "Refusing to remove unexpected binary cache path: $($cacheItem.FullName)"
              }
              Remove-Item -LiteralPath $expectedCache -Recurse -Force
              Write-Host "Removed vcpkg binary archive cache: $expectedCache"
          } else {
              Write-Host "vcpkg binary archive cache already absent: $expectedCache"
          }

      - name: Restore locked VarifyServer dependencies for cross-language tests
        shell: cmd
        working-directory: VarifyServer
        run: npm ci --ignore-scripts

      - name: Build and run layered Server tests
        shell: pwsh
        run: |
          & .\scripts\windows-local.ps1 `
              -Task RunServerTests -SkipTestStructureCheck `
              -Configuration Release `
              -VcpkgRoot $env:VCPKG_ROOT `
              -VcpkgInstalledRoot (Join-Path $env:GITHUB_WORKSPACE '.ci\vcpkg_installed') `
              -VcpkgBuildtreesRoot (Join-Path $env:RUNNER_TEMP 'vcpkg-buildtrees') `
              -VcpkgPackagesRoot (Join-Path $env:RUNNER_TEMP 'vcpkg-packages') `
              -ServerIntermediateRoot (Join-Path $env:RUNNER_TEMP 'server-msbuild') `
              -ServerTriplet x64-windows-chat-release `
              -ServerHostTriplet x64-windows-chat-release

      - name: Upload layered Server test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-server-test-results
          path: build/test-results/server_*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify independent app-local server directories
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'build\windows-servers\Release'
          $coreAppLocalDlls = @(
              'abseil_dll.dll',
              'hiredis.dll',
              'libcrypto-3-x64.dll',
              'libprotobuf.dll',
              'libssl-3-x64.dll',
              'zlib1.dll'
          )

          foreach ($serverName in @('GateServer', 'StatusServer', 'ChatServer', 'ResourceServer')) {
              $serverDirectory = Join-Path $releaseRoot $serverName
              $requiredDlls = if ($serverName -eq 'ResourceServer') {
                  $coreAppLocalDlls | Where-Object { $_ -ne 'hiredis.dll' }
              } else { $coreAppLocalDlls }
              $requiredFiles = @("$serverName.exe", 'config.ini') + $requiredDlls
              foreach ($fileName in $requiredFiles) {
                  $filePath = Join-Path $serverDirectory $fileName
                  if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
                      throw "$serverName is not self-contained; missing $fileName in $serverDirectory"
                  }
              }
              Write-Host "$serverName app-local directory verified: $serverDirectory"
          }

          $chatConfigs = Join-Path $releaseRoot 'ChatServer\configs'
          foreach ($configName in @('chat-01.ini', 'chat-02.ini')) {
              if (-not (Test-Path -LiteralPath (Join-Path $chatConfigs $configName) -PathType Leaf)) {
                  throw "ChatServer release is missing example instance config: $configName"
              }
          }

      - name: Create independent server ZIP packages
        if: env.BUILD_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE 'build\windows-servers\Release'
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-servers'
          [void](New-Item -ItemType Directory -Path $packageRoot -Force)

          foreach ($serverName in @('GateServer', 'StatusServer', 'ChatServer', 'ResourceServer')) {
              $source = Join-Path $releaseRoot $serverName
              $stage = Join-Path $packageRoot $serverName
              [void](New-Item -ItemType Directory -Path $stage -Force)
              Copy-Item -LiteralPath (Join-Path $source "$serverName.exe") -Destination $stage
              Copy-Item -LiteralPath (Join-Path $source 'config.ini') -Destination $stage
              Get-ChildItem -LiteralPath $source -Filter '*.dll' -File |
                  Copy-Item -Destination $stage
              if ($serverName -eq 'ChatServer') {
                  Copy-Item -LiteralPath (Join-Path $source 'configs') -Destination $stage -Recurse
              }
              & ./scripts/ci/package-server-runtime.ps1 -Stage $stage
              $licenses = Join-Path $stage 'licenses'
              [void](New-Item -ItemType Directory -Path $licenses -Force)
              Get-ChildItem -Path '.ci/vcpkg_installed/x64-windows-chat-release/share/*/copyright' -File |
                  ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $licenses ($_.Directory.Name + '.txt')) }
              Compress-Archive -Path (Join-Path $stage '*') `
                  -DestinationPath (Join-Path $packageRoot "$serverName.zip") `
                  -CompressionLevel Optimal
          }

      - name: Upload server release directories
        if: env.BUILD_PACKAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-servers-release
          path: dist/windows-servers/*.zip
          if-no-files-found: error
          retention-days: 7

  client-release:
    name: Qt client Release
    needs: static-check
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Qt 6.5.3 and MinGW 11.2
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.5.3
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_mingw90
          cache: false

      - name: Build and test Qt client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\scripts\windows-local.ps1 `
              -Task RunClientTests -SkipTestStructureCheck `
              -Configuration Release `
              -QtRoot $env:QT_ROOT_DIR

      - name: Upload layered Qt client test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-client-test-results
          path: build/test-results/client_*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Deploy and package Qt client
        if: env.BUILD_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'build\windows-client\Release'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-client\chat-client'
          [void](New-Item -ItemType Directory -Path $stage -Force)
          Copy-Item -LiteralPath (Join-Path $source 'chat.exe') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $source 'config.ini') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $source 'static') -Destination $stage -Recurse

          $deployTool = Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe'
          & $deployTool --compiler-runtime --no-translations (Join-Path $stage 'chat.exe')
          if ($LASTEXITCODE -ne 0) {
              throw "windeployqt failed with exit code $LASTEXITCODE."
          }
          foreach ($required in @('Qt6Core.dll', 'Qt6Widgets.dll', 'platforms\qwindows.dll')) {
              if (-not (Test-Path -LiteralPath (Join-Path $stage $required) -PathType Leaf)) {
                  throw "Qt client package is missing $required"
              }
          }

          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist\windows-client\chat-client.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload Qt client ZIP
        if: env.BUILD_PACKAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-chat-client-release
          path: dist/windows-client/chat-client.zip
          if-no-files-found: error
          retention-days: 7

  varify-release:
    name: VarifyServer dependency and package check
    needs: static-check
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VarifyServer/package-lock.json

      - name: Restore locked VarifyServer dependencies
        shell: cmd
        working-directory: VarifyServer
        run: npm ci --ignore-scripts

      - name: Validate JavaScript and dependency tree
        shell: pwsh
        working-directory: VarifyServer
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($sourceFile in Get-ChildItem -LiteralPath . -Filter '*.js' -File) {
              node --check $sourceFile.FullName
              if ($LASTEXITCODE -ne 0) {
                  throw "JavaScript syntax check failed: $($sourceFile.Name)"
              }
          }
          npm.cmd ls --omit=dev
          if ($LASTEXITCODE -ne 0) {
              throw "npm dependency validation failed with exit code $LASTEXITCODE."
          }

      - name: Run layered VarifyServer tests
        shell: pwsh
        run: .\scripts\windows-local.ps1 -Task RunVarifyTests -SkipTestStructureCheck

      - name: Upload layered VarifyServer test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-varify-test-results
          path: build/test-results/varify_*.xml
          if-no-files-found: error
          retention-days: 7

      - name: Package VarifyServer
        if: env.BUILD_PACKAGES == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'VarifyServer'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'dist\varify-server\VarifyServer'
          [void](New-Item -ItemType Directory -Path $stage -Force)
          foreach ($pattern in @('*.js', '*.json')) {
              Get-ChildItem -LiteralPath $source -Filter $pattern -File |
                  Copy-Item -Destination $stage
          }
          Copy-Item -LiteralPath (Get-Command node.exe).Source -Destination (Join-Path $stage 'node.exe')
          Copy-Item -LiteralPath (Join-Path $source 'node_modules') -Destination $stage -Recurse
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'dist\varify-server\VarifyServer.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zipPath -CompressionLevel Optimal

      - name: Upload VarifyServer ZIP
        if: env.BUILD_PACKAGES == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-varify-server-release
          path: dist/varify-server/VarifyServer.zip
          if-no-files-found: error
          retention-days: 7
